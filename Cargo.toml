[package]
name = "fastexec"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
license = "Apache-2.0"
description = "MCP server that runs bash commands with background tasks, stdin input, and PTY"

[dependencies]
alacritty_terminal = "=0.26.0"
bytes = "1"
encoding_rs = "0.8"
getrandom = "0.3"
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "service"] }
rmcp = { version = "=2.2.0", features = ["server", "transport-io", "macros", "transport-streamable-http-server"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal", "net", "io-std", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower-service = "0.3"
unicode-width = "0.2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Globalization", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Shell"] }

# Every CLI command hashes this image, and a debug-built SHA-256 is slow enough to show: the
# dependency is optimized so the hash costs milliseconds rather than seconds.
[profile.dev.package.sha2]
opt-level = 3

[profile.dev.package.digest]
opt-level = 3

[profile.release]
strip = true
lto = true
