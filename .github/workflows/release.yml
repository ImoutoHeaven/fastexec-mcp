name: release

# A pushed tag vX.Y.Z builds every platform, runs the CI suite on the tagged commit, and creates a
# draft GitHub Release. A manual run builds and smoke-tests the archives without releasing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

# One attempt per tag at a time, so a retagged attempt never overlaps an older one.
concurrency:
  group: release-${{ github.ref }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      commit: ${{ steps.version.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: version
        run: |
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
              exit 1
            fi
            if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "::error::tag $GITHUB_REF_NAME points to a commit outside main"
              exit 1
            fi
          fi

  ci:
    needs: check
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/ci.yml

  build:
    name: build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: linux-amd64, runner: ubuntu-24.04, target: x86_64-unknown-linux-musl }
          - { name: linux-arm64, runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl }
          - { name: macos-amd64, runner: macos-latest, target: x86_64-apple-darwin }
          - { name: macos-arm64, runner: macos-latest, target: aarch64-apple-darwin }
          - { name: windows-amd64, runner: windows-latest, target: x86_64-pc-windows-msvc }
          - { name: windows-arm64, runner: windows-11-arm, target: aarch64-pc-windows-msvc }
    defaults:
      run:
        shell: bash
    env:
      VERSION: ${{ needs.check.outputs.version }}
      BIN: target/${{ matrix.target }}/release/fastexec${{ contains(matrix.target, 'windows') && '.exe' || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: build
        run: cargo build --release --locked --target ${{ matrix.target }}

      # The binary must start and report the release version over MCP stdio.
      - name: smoke test
        run: |
          request='{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"smoke","version":"0"}}}'
          reply="$(printf '%s\n' "$request" | env -u FASTEXEC_DAEMON "$BIN")"
          echo "$reply"
          grep -F "\"serverInfo\":{\"name\":\"fastexec\",\"version\":\"$VERSION\"}" <<< "$reply"

      - name: package
        env:
          COPYFILE_DISABLE: "1"
        run: |
          name="fastexec-$VERSION-${{ matrix.name }}"
          mkdir -p "dist/$name"
          mkdir -p "dist/$name/vendor/conpty"
          cp "$BIN" LICENSE NOTICE README.md "dist/$name/"
          cp vendor/conpty/LICENSE "dist/$name/vendor/conpty/"
          cd dist
          if [ "$RUNNER_OS" = Windows ]; then
            pwsh -NoProfile -NonInteractive -Command "Compress-Archive -Path '$name' -DestinationPath '$name.zip'"
          else
            tar -czf "$name.tar.gz" "$name"
          fi

      - name: smoke test Linux archive on Alpine
        if: startsWith(matrix.name, 'linux-')
        env:
          ARCHIVE_PLATFORM: ${{ matrix.name }}
        run: |
          docker run --rm --init -v "$GITHUB_WORKSPACE/dist:/archives:ro" \
            -v "$GITHUB_WORKSPACE/scripts/ci/smoke-release.py:/smoke-release.py:ro" \
            -e VERSION -e ARCHIVE_PLATFORM alpine:3.23 sh -ec '
              apk add --no-cache bash python3
              mkdir /tmp/archive
              tar -xzf "/archives/fastexec-$VERSION-$ARCHIVE_PLATFORM.tar.gz" -C /tmp/archive
              python3 /smoke-release.py \
                "/tmp/archive/fastexec-$VERSION-$ARCHIVE_PLATFORM/fastexec" "$VERSION"
            '

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.name }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  build-freebsd:
    name: build (freebsd-amd64)
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: native build, package and smoke test
        uses: vmactions/freebsd-vm@c46abacb49f09938ca4e1702d15d836285d694cc # v1.5.9
        with:
          release: "15.1"
          arch: x86_64
          mem: 6144
          cpu: 4
          envs: VERSION
          prepare: |
            pkg install -y bash rust python3
          run: |
            set -eu
            export CARGO_TARGET_DIR=/tmp/fastexec-release-target
            export CARGO_BUILD_JOBS=2
            freebsd-version
            rustc --version
            cargo build --release --locked
            name="fastexec-$VERSION-freebsd-amd64"
            mkdir -p "dist/$name/vendor/conpty"
            cp "$CARGO_TARGET_DIR/release/fastexec" LICENSE NOTICE README.md "dist/$name/"
            cp vendor/conpty/LICENSE "dist/$name/vendor/conpty/"
            tar -czf "dist/$name.tar.gz" -C dist "$name"
            probe=$(mktemp -d)
            trap 'rm -rf "$probe"' EXIT
            tar -xzf "dist/$name.tar.gz" -C "$probe"
            python3 scripts/ci/smoke-release.py "$probe/$name/fastexec" "$VERSION"

      - uses: actions/upload-artifact@v4
        with:
          name: release-freebsd-amd64
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    needs: [check, ci, build, build-freebsd]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: release-*
          merge-multiple: true

      - name: checksums
        working-directory: dist
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS

      - name: draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A tag moved since this run started would receive archives built from another commit.
          live="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_REF" --jq .sha)"
          if [ "$live" != "${{ needs.check.outputs.commit }}" ]; then
            echo "::error::$GITHUB_REF_NAME now points to $live, not the built ${{ needs.check.outputs.commit }}"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" \
            --draft --verify-tag --generate-notes --title "fastexec ${{ needs.check.outputs.version }}"
